<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0814">
<title>File</title>
__META__
<style>
  :root {
    --bg: #0e0814;
    --surface: #1a1026;
    --ink: #fff4fa;
    --muted: #a893b8;
    --line: rgba(255, 244, 250, .12);
    --rose: #ff3b81;
    --amber: #ffb44d;
    --grad: linear-gradient(135deg, var(--rose), var(--amber));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 59, 129, .22), transparent 60%),
      radial-gradient(100% 50% at 50% 115%, rgba(122, 60, 255, .20), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  main { width: 100%; max-width: 320px; text-align: center; }

  .mark { width: 96px; height: 96px; margin: 0 auto 28px; position: relative; }
  .mark::before {
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    background: var(--grad); filter: blur(28px); opacity: .38;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 59, 129, 0) 0%, var(--rose) 55%, var(--amber) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    animation: spin 1.15s linear infinite;
  }
  .core {
    position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #2a1740, var(--surface) 70%); border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .core svg { grid-area: 1 / 1; width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .core svg.g-ok { width: 54px; height: 54px; stroke: none; filter: drop-shadow(0 4px 14px rgba(255, 40, 120, .7)); }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.8s ease-in-out infinite; }
  .tw2 { animation-delay: 1.1s; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.08); } }
  .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
  .g-err { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; font-weight: 650; letter-spacing: -.02em; }
  #step { margin: 0; min-height: 21px; font-size: 14px; line-height: 1.5; color: var(--muted); transition: opacity .25s ease; }
  #step.swap { opacity: 0; }

  .bar { height: 4px; margin: 28px auto 0; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0; border-radius: 2px;
    background: linear-gradient(90deg, var(--rose), var(--amber), var(--rose)); background-size: 200% 100%;
    transition: width .7s cubic-bezier(.3, .6, .3, 1);
    animation: slide 1.4s linear infinite;
  }
  @keyframes slide { to { background-position: -200% 0; } }

  .hint { margin: 28px 0 0; font-size: 13px; line-height: 1.7; color: var(--muted); opacity: 0; visibility: hidden; transition: opacity .4s ease; }
  .hint.show { opacity: 1; visibility: visible; }
  .hint a {
    display: inline-block; margin-top: 8px; padding: 10px 22px; border-radius: 999px;
    background: var(--grad); color: #1a0b14; font-weight: 600; font-size: 14px; text-decoration: none;
    box-shadow: 0 8px 26px rgba(255, 59, 129, .35);
  }
  .hint a:active { transform: scale(.97); }
  .hint a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  body.err .bar, body.err .hint, body.err .mark::before { display: none; }
  body.err .ring { animation: none; background: var(--line); }
  body.err .g-ok { display: none; }
  body.err .g-err { display: block; stroke: #ff8a8a; }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation-duration: 3s; }
    .tw, .beat { animation: none; }
    .bar i { animation: none; transition: none; }
    #step, .hint { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <div class="ring"></div>
    <div class="core">
      <svg class="g-ok" viewBox="0 0 64 56" aria-hidden="true">
        <defs>
          <linearGradient id="lipU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5c93"/><stop offset="1" stop-color="#c2155f"/></linearGradient>
          <linearGradient id="lipL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset=".55" stop-color="#f0276f"/><stop offset="1" stop-color="#b8104f"/></linearGradient>
          <radialGradient id="lipG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="beat">
          <path d="M3 28C12 22 18 13 26 13c3.2 0 5 1.8 6 4 1-2.2 2.8-4 6-4 8 0 14 9 23 15-10 2-20 3-29 3S13 30 3 28z" fill="url(#lipU)"/>
          <path d="M3 28c10 2 20 3 29 3s19-1 29-3c-5.5 13-16 20-29 20S8.5 41 3 28z" fill="url(#lipL)"/>
          <path d="M3 28c10 2 20 3 29 3s19-1 29-3" fill="none" stroke="#6a0a33" stroke-width="1.4" stroke-linecap="round"/>
          <ellipse cx="32" cy="39" rx="11" ry="3.6" fill="url(#lipG)"/>
          <ellipse cx="21" cy="19" rx="5" ry="1.8" fill="#fff" opacity=".45" transform="rotate(-24 21 19)"/>
          <ellipse cx="43" cy="19" rx="4" ry="1.5" fill="#fff" opacity=".3" transform="rotate(24 43 19)"/>
        </g>
        <path class="tw" d="M54 3v9M49.5 7.500h9" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        <path class="tw tw2" d="M8 4v6M5 7h6" stroke="#ffd2e3" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="g-err" viewBox="0 0 34 34"><circle cx="17" cy="17" r="12"/><path d="M17 10.5v8M17 23h.01"/></svg>
    </div>
  </div>

  <h1 id="title">Opening your file</h1>
  <p id="step" role="status" aria-live="polite">Checking your link</p>

  <div class="bar" id="bar"><i id="fill"></i></div>

  <p class="hint" id="hint">Telegram didn't open?<br><a id="manual" href="__TARGET_ATTR__">Open in Telegram</a></p>
</main>

<script>
const TARGET = __TARGET_JSON__;
const MSG = __MSG_JSON__;
const $ = (id) => document.getElementById(id);

if (!TARGET) {
  document.body.classList.add("err");
  $("title").textContent = "Couldn't open the link";
  $("step").textContent = MSG || "Please try again in a moment.";
} else {
  const steps = ["Checking your link", "Connecting to the bot", "Opening Telegram"];
  const fill = $("fill");
  const step = $("step");

  function setStep(i) {
    step.classList.add("swap");
    setTimeout(() => { step.textContent = steps[i]; step.classList.remove("swap"); }, 220);
  }

  requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = "35%"; }));
  setTimeout(() => { setStep(1); fill.style.width = "70%"; }, 700);
  setTimeout(() => { setStep(2); fill.style.width = "100%"; }, 1400);
  setTimeout(() => { location.replace(TARGET); }, 1900);
  setTimeout(() => { $("hint").classList.add("show"); }, 4500);
}
</script>
</body>
</html>
