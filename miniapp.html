<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0814">
<title>File</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--AD_TAG-->
<style>
  :root {
    --bg: #0e0814;
    --surface: #1a1026;
    --ink: #fff4fa;
    --muted: #a893b8;
    --line: rgba(255, 244, 250, .12);
    --rose: #ff3b81;
    --amber: #ffb44d;
    --grad: linear-gradient(135deg, var(--rose), var(--amber));
    --err: #ff8a8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255, 59, 129, .22), transparent 60%),
      radial-gradient(100% 50% at 50% 115%, rgba(122, 60, 255, .20), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }
  main { width: 100%; max-width: 320px; text-align: center; }

  /* ---------- orb: ring + core ---------- */
  .icon { width: 96px; height: 96px; margin: 0 auto 28px; position: relative; }
  .icon::before {                       /* soft glow behind the ring */
    content: ""; position: absolute; inset: -14px; border-radius: 50%;
    background: var(--grad); filter: blur(28px); opacity: .38;
    transition: opacity .5s ease;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(255, 59, 129, 0) 0%, var(--rose) 55%, var(--amber) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    animation: spin 1.15s linear infinite;
  }
  .core {
    position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #2a1740, var(--surface) 70%);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    transition: background .4s ease, border-color .4s ease;
  }
  .core svg { grid-area: 1 / 1; width: 34px; height: 34px; fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: opacity .25s ease, transform .35s cubic-bezier(.3, 1.4, .5, 1); }
  .core svg.g-gem { width: 54px; height: 54px; stroke: none; filter: drop-shadow(0 4px 14px rgba(255, 40, 120, .7)); }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.8s ease-in-out infinite; }
  .tw2 { animation-delay: 1.1s; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.08); } }
  .tw { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
  .g-tick, .g-stop { opacity: 0; transform: scale(.6); }
  .g-tick path { stroke-dasharray: 30; stroke-dashoffset: 30; }

  .icon.done .ring { animation: none; background: var(--grad); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
  .icon.done .core { background: var(--grad); border-color: transparent; }
  .icon.done .g-gem { opacity: 0; transform: scale(.6); }
  .icon.done .g-tick { opacity: 1; transform: scale(1); stroke: #1a0b14; stroke-width: 2.4; }
  .icon.done .g-tick path { animation: draw .45s .15s ease forwards; }
  .icon.done::before { opacity: .6; }

  .icon.stop .ring { animation: none; background: var(--line); }
  .icon.stop::before { opacity: 0; }
  .icon.stop .g-gem { opacity: 0; transform: scale(.6); }
  .icon.stop .g-stop { opacity: 1; transform: scale(1); stroke: var(--err); }

  /* one-time burst when the file is delivered */
  .spark { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--grad); opacity: 0; }
  .icon.done .spark { animation: burst .8s .1s cubic-bezier(.2, .7, .3, 1) forwards; }
  .spark:nth-of-type(1) { --a: 0deg; } .spark:nth-of-type(2) { --a: 45deg; } .spark:nth-of-type(3) { --a: 90deg; } .spark:nth-of-type(4) { --a: 135deg; }
  .spark:nth-of-type(5) { --a: 180deg; } .spark:nth-of-type(6) { --a: 225deg; } .spark:nth-of-type(7) { --a: 270deg; } .spark:nth-of-type(8) { --a: 315deg; }
  @keyframes burst {
    0% { opacity: 1; transform: rotate(var(--a)) translateY(-48px) scale(1); }
    100% { opacity: 0; transform: rotate(var(--a)) translateY(-84px) scale(.3); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ---------- copy ---------- */
  #status { margin: 0; min-height: 28px; font-size: 21px; line-height: 1.3; font-weight: 650; letter-spacing: -.02em; }
  #status.err { color: var(--err); }
  #status.load::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
  #sub { margin: 8px 0 0; min-height: 20px; font-size: 14px; line-height: 1.5; color: var(--muted); }
  #progress { margin: 18px 0 0; min-height: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .dots { display: inline-flex; gap: 6px; }
  .dots b { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
  .dots b.on { background: var(--grad); }
  .dots b.now { background: linear-gradient(90deg, var(--rose), var(--amber)); opacity: .55; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-block; margin-top: 24px; padding: 13px 28px;
    border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255, 244, 250, .06); color: var(--ink);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  .btn.solid { background: var(--grad); border-color: transparent; color: #1a0b14; box-shadow: 0 8px 26px rgba(255, 59, 129, .35); }
  .btn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation-duration: 3s; }
    #status.load::after, .dots b.now { animation: none; }
    .spark { display: none; }
    .tw, .beat { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon">
    <div class="ring"></div>
    <div class="core">
      <svg class="g-gem" viewBox="0 0 64 56" aria-hidden="true">
        <defs>
          <linearGradient id="lipU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5c93"/><stop offset="1" stop-color="#c2155f"/></linearGradient>
          <linearGradient id="lipL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7aa8"/><stop offset=".55" stop-color="#f0276f"/><stop offset="1" stop-color="#b8104f"/></linearGradient>
          <radialGradient id="lipG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        </defs>
        <g class="beat">
          <path d="M3 28C12 22 18 13 26 13c3.2 0 5 1.8 6 4 1-2.2 2.8-4 6-4 8 0 14 9 23 15-10 2-20 3-29 3S13 30 3 28z" fill="url(#lipU)"/>
          <path d="M3 28c10 2 20 3 29 3s19-1 29-3c-5.5 13-16 20-29 20S8.5 41 3 28z" fill="url(#lipL)"/>
          <path d="M3 28c10 2 20 3 29 3s19-1 29-3" fill="none" stroke="#6a0a33" stroke-width="1.4" stroke-linecap="round"/>
          <ellipse cx="32" cy="39" rx="11" ry="3.6" fill="url(#lipG)"/>
          <ellipse cx="21" cy="19" rx="5" ry="1.8" fill="#fff" opacity=".45" transform="rotate(-24 21 19)"/>
          <ellipse cx="43" cy="19" rx="4" ry="1.5" fill="#fff" opacity=".3" transform="rotate(24 43 19)"/>
        </g>
        <path class="tw" d="M54 3v9M49.5 7.500h9" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        <path class="tw tw2" d="M8 4v6M5 7h6" stroke="#ffd2e3" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="g-tick" viewBox="0 0 34 34"><path d="M9 17.5l5.5 5.5L25 11.5"/></svg>
      <svg class="g-stop" viewBox="0 0 34 34"><circle cx="17" cy="17" r="12"/><path d="M17 10.5v8M17 23h.01"/></svg>
    </div>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
    <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="sub"></p>
  <div id="progress"></div>
  <button class="btn solid" id="watch" hidden>Watch ad</button>
  <button class="btn" id="retry" hidden>Try again</button>
  <button class="btn solid" id="openbot" hidden>Open bot</button>
</main>

<script>
const CFG = __CFG__;
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor("#0e0814"); tg.setBackgroundColor("#0e0814"); } catch (e) {}
try { tg.setBottomBarColor("#0e0814"); } catch (e) {}

const qs = new URLSearchParams(location.search);
let sid = qs.get("sid") || null;                     // purana bot-button flow
const startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
const $ = (id) => document.getElementById(id);
let rewarded = false;
let askedWrite = false;

function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = cls || "";
}
function setSub(text) { $("sub").textContent = text || ""; }
function setProgress(done, required) {
  const el = $("progress");
  el.textContent = "";
  if (required > 1) {
    const cur = Math.min(done + 1, required);
    el.append("Ad " + cur + " of " + required);
    const d = document.createElement("span");
    d.className = "dots";
    for (let i = 0; i < required; i++) {
      const b = document.createElement("b");
      if (i < done) b.className = "on"; else if (i === cur - 1) b.className = "now";
      d.appendChild(b);
    }
    el.appendChild(d);
  }
}
function setIcon(state) {                              // "" | "stop" | "done"
  $("icon").className = "icon " + state;
}
function fail(msg) {
  setStatus(msg, "err");
  setSub("");
  setIcon("stop");
  $("retry").hidden = false;
}

async function api(path, extra) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ sid: sid, init_data: tg.initData, ymid: curYmid }, extra || {})),
  });
  return r.json();
}

// Monetag SDK: script load hone par window.show_<ZONE> function ban jaata hai
function waitForSdk(ms, zone) {
  const fn = "show_" + (zone || CFG.zoneId);
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function check() {
      if (typeof window[fn] === "function") return resolve(window[fn]);
      if (Date.now() - t0 > ms) return reject(new Error("sdk missing"));
      setTimeout(check, 100);
    })();
  });
}

// Optimizer ne default se alag zone chuna ho to uska SDK ab load karo (Monetag docs wala hi tag format)
function loadZoneSdk(zone, url) {
  if (typeof window["show_" + zone] === "function") return waitForSdk(100, zone);
  if (!document.querySelector('script[data-zone="' + zone + '"]')) {
    const sc = document.createElement("script");
    sc.src = url; sc.dataset.zone = zone; sc.dataset.sdk = "show_" + zone;
    sc.onerror = () => { window.__sdkErr = 1; };
    document.head.appendChild(sc);
  }
  return waitForSdk(10000, zone);
}

let claimed = false, adRunning = false, adStartedAt = 0, watchdog = null;
let curYmid = null, curZone = CFG.zoneId;

function reportFail(reason) {            // sirf stats + auto-bench; reward par koi asar nahi
  try { api("/api/ad/fail", { reason: reason }).catch(() => {}); } catch (e) {}
}
function failReason(e) {
  const m = String(errText(e) || "");
  if (/empty feed/i.test(m)) return "empty_feed";
  if (/timeout/i.test(m)) return "timeout";
  return "error";
}

const LOG = [];
function log(msg) {
  const t = adStartedAt ? ((Date.now() - adStartedAt) / 1000).toFixed(1) : "0.0";
  LOG.push("+" + t + "s " + msg);
  if (CFG.showLog) {
    let el = $("log");
    if (!el) { el = document.createElement("pre"); el.id = "log"; el.style.cssText = "font-size:10px;text-align:left;white-space:pre-wrap;color:var(--muted);margin-top:16px"; document.querySelector("main").appendChild(el); }
    el.textContent = LOG.join("\n");
  }
}

function errText(e) {
  if (!e) return "";
  if (typeof e === "string") return e;
  return e.message || e.error || e.reason || (function () { try { return JSON.stringify(e); } catch (_) { return ""; } })();
}

function playAd(show) {
  if (adRunning) return;
  adRunning = true; claimed = false;
  $("watch").hidden = true;
  setIcon("");
  setStatus("Ad is playing", "load");
  setSub("Watch till the end to unlock your file");
  adStartedAt = Date.now();
  log("show() called, zone " + curZone);

  // ad kabhi respond hi na kare to user atka na rahe
  clearTimeout(watchdog);
  watchdog = setTimeout(() => {
    if (claimed) return;
    adRunning = false;
    log("watchdog: no response");
    reportFail("timeout");
    fail("The ad didn't respond. Please try again.");
  }, 60000);

  let p;
  try { p = show({ ymid: curYmid, requestVar: "unlock" }); }
  catch (e) { clearTimeout(watchdog); adRunning = false; log("throw " + errText(e)); reportFail("error"); fail("Ad setup failed. Please try again shortly."); return; }

  Promise.resolve(p).then((result) => {
    // Monetag docs: promise "ad band hone ke baad" resolve hota hai; paid hua ya nahi = result.reward_event_type.
    // Asli enforcement server par hota hai (AD_VERIFY_MODE=postback); yeh client check sirf honest UX ke liye.
    log("ad closed (resolved) " + (result && result.reward_event_type ? result.reward_event_type : "no-result"));
    clearTimeout(watchdog);
    adRunning = false;
    if (claimed) return;
    if (CFG.blockNonValued && result && result.reward_event_type === "non_valued") {
      reportFail("non_valued");
      fail("That ad didn't count. Please try again.");
      return;
    }
    claimed = true;
    claim();
  }).catch((e) => {
    clearTimeout(watchdog);
    adRunning = false;
    const why = errText(e);
    log("rejected: " + why);
    reportFail(failReason(e));
    fail("No ad could be shown right now" + (CFG.showLog && why ? " (" + String(why).slice(0, 80) + ")" : "") + ". Please try again shortly.");
  });
}

async function startAd(sdkP) {
  const show = await sdkP;
  if (!show) {
    reportFail(window.__sdkErr ? "blocked" : "timeout");
    if (window.__sdkErr) fail("The ad script was blocked. Turn off AdBlock / Private DNS and try again.");
    else fail("The ad script didn't load. Please check your connection and try again.");
    return;
  }
  $("watch").onclick = () => playAd(show);
  playAd(show);                     // seedha ad chalao, koi extra button nahi
}

async function claim() {
  setStatus("Verifying", "load");
  setSub("Confirming your ad view");
  let r;
  try { r = await api("/api/ad/done"); }
  catch (e) { rewarded = false; fail("Network error. Please try again."); return; }

  if (r.wait) { setTimeout(claim, r.wait * 1000 + 300); return; }
  if (!r.ok) { rewarded = false; fail(r.error || "Verification failed."); return; }

  setProgress(r.ads_done, r.ads_required);
  if (r.delivered) {
    setIcon("done");
    setStatus("Sent! Check your chat.");
    setSub("This window will close on its own");
    $("progress").textContent = "";
    setTimeout(() => tg.close(), 1600);
  } else {
    rewarded = false;
    begin();
  }
}

// The bot isn't allowed to message this user yet
function needWrite(bot) {
  if (!askedWrite && typeof tg.requestWriteAccess === "function") {
    askedWrite = true;
    setStatus("Waiting for permission", "load");
    setSub("Allow the bot to send you the file");
    tg.requestWriteAccess((ok) => { if (ok) begin(); else showBot(bot); });
  } else {
    showBot(bot);
  }
}
function showBot(bot) {
  setIcon("stop");
  setStatus("Start the bot first");
  setSub("Open the bot once, then your file will arrive in the chat.");
  const b = $("openbot");
  b.hidden = false;
  b.onclick = () => {
    tg.openTelegramLink("https://t.me/" + bot + "?start=" + encodeURIComponent(startParam));
    tg.close();
  };
}

async function begin() {
  $("retry").hidden = true;
  $("openbot").hidden = true;
  $("watch").hidden = true;
  setIcon("");
  rewarded = false;
  if (!tg.initData) { fail("Please open this inside Telegram."); return; }
  setStatus("Loading your ad", "load");
  setSub("One short ad unlocks your file");
  if (CFG.smart) { smartBegin(); return; }   // multi-network flow (SMART_ADS_ENABLED); otherwise the original Monetag flow below

  const sdkP0 = waitForSdk(10000).catch(() => null);  // default zone ka SDK session start ke saath hi load
  let s;
  try { s = await api("/api/ad/start"); }
  catch (e) { fail("Network error. Please try again."); return; }
  if (s.code === "no_write") { needWrite(s.bot); return; }
  if (!s.ok) { fail(s.error || "Session expired."); return; }

  sid = s.sid;
  curYmid = s.ymid || null;
  curZone = s.zone || CFG.zoneId;
  setProgress(s.ads_done, s.ads_required);
  const sdkP = (curZone === CFG.zoneId) ? sdkP0 : loadZoneSdk(curZone, s.sdk).catch(() => null);
  startAd(sdkP);
}

// ---------------- smart multi-network flow (only used when CFG.smart) ----------------
// Always resolves to an object {ok, code?, error?, ...}; never leaves the UI guessing.
// Categories: network | timeout | http_<status> | bad_response | validation_error | session | ... (server-provided)
const SAPI_TIMEOUT_MS = 20000;
async function sapi(path, extra) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), SAPI_TIMEOUT_MS);
  try {
    const r = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ sid: sid, init_data: tg.initData }, extra || {})),
      signal: ctl.signal,
    });
    let j = null;
    try { j = await r.json(); } catch (e) { /* non-JSON body */ }
    if (j && typeof j === "object" && !Array.isArray(j) && ("ok" in j)) return j;
    if (!j) return { ok: false, code: "bad_response", error: "The server sent an unreadable response (HTTP " + r.status + "). Please try again." };
    return { ok: false, code: "http_" + r.status, error: "The server rejected the request (HTTP " + r.status + "). Please try again." };
  } catch (e) {
    if (e && e.name === "AbortError") return { ok: false, code: "timeout", error: "The server took too long to respond. Please try again." };
    return { ok: false, code: "network", error: "Network error. Please check your connection and try again." };
  } finally {
    clearTimeout(timer);
  }
}
function smartError(r, fallback) {      // never claim "Session expired" unless the server said so
  return (r && r.error) || ((r && r.code) ? fallback + " (" + r.code + ")" : fallback);
}
function loadSmartLib() {              // adapters are fetched only when needed
  if (window.SmartAds) return Promise.resolve(window.SmartAds);
  return new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "/ads/adapters.js"; sc.onload = () => res(window.SmartAds); sc.onerror = () => rej(new Error("adapters"));
    document.head.appendChild(sc);
  });
}
async function smartBegin() {
  let S, s;
  try { S = await loadSmartLib(); } catch (e) { fail("Couldn't load. Please check your connection and try again."); return; }
  s = await sapi("/api/smart/start");
  if (s.code === "no_write") { needWrite(s.bot); return; }
  if (!s.ok) { fail(smartError(s, "Couldn't start the ad")); return; }
  sid = s.sid;
  setProgress(s.ads_done, s.ads_required);
  const adapters = S.createAdapters(S.browserEnv(window));
  const out = await S.runChain(s, adapters, sapi, {
    loading: () => { setStatus("Loading your ad", "load"); setSub("One short ad unlocks your file"); },
    shown: () => { setStatus("Ad is playing", "load"); setSub("Watch till the end to unlock your file"); },
  });
  if (out.kind === "skipped") { fail("The ad was closed before the end. Please try again."); return; }
  if (out.kind !== "completed") {
    fail(out.displayed ? "The ad was interrupted. Please try again." : "No ad is available right now. Please try again shortly.");
    return;
  }
  setStatus("Verifying", "load");
  setSub("Confirming your ad view");
  let r;
  try { r = await S.claim(out.state, out.res, sapi, (ms) => new Promise((x) => setTimeout(x, ms))); }
  catch (e) { fail("Network error. Please try again."); return; }
  if (!r.ok) { fail(smartError(r, "Verification failed")); return; }
  setProgress(r.ads_done, r.ads_required);
  if (r.delivered) {
    setIcon("done");
    setStatus("Sent! Check your chat.");
    setSub("This window will close on its own");
    $("progress").textContent = "";
    setTimeout(() => tg.close(), 1600);
  } else {
    begin();                           // more ads required: one new request, still one ad at a time
  }
}

$("retry").addEventListener("click", begin);
begin();   // the ad starts as soon as the mini app opens, no extra button
</script>
</body>
</html>
